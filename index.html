<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── PRIMARY SEO ── -->
    <title>Villain Culture | Dark Streetwear Clothing Brand</title>
    <meta
      name="description"
      content="Villain Culture is a dark streetwear clothing brand built for the ones who never fit. Shop oversized tees, jackets, joggers and accessories."
    />
    <meta
      name="keywords"
      content="villain culture, dark streetwear, oversized tees, gothic clothing, streetwear brand, villain clothing, dark fashion"
    />
    <meta name="author" content="Villain Culture" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vllnculture.com" />

    <!-- ── OPEN GRAPH ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vllnculture.com" />
    <meta
      property="og:title"
      content="Villain Culture | Dark Streetwear Clothing Brand"
    />
    <meta
      property="og:description"
      content="Built for the ones who never fit. Dark streetwear clothing. Shop now."
    />
    <meta property="og:image" content="https://vllnculture.com/mascot.png" />
    <meta property="og:site_name" content="Villain Culture" />
    <meta property="og:locale" content="en_US" />

    <!-- ── TWITTER CARD ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vllnculture.com" />
    <meta name="twitter:title" content="Villain Culture | Dark Streetwear" />
    <meta
      name="twitter:description"
      content="Built for the ones who never fit. Dark streetwear clothing."
    />
    <meta name="twitter:image" content="https://vllnculture.com/mascot.png" />

    <!-- ── FAVICON ── -->
    <link rel="icon" type="image/png" href="/mascot.png" />
    <link rel="apple-touch-icon" href="/mascot.png" />

    <!-- ── THEME ── -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="msapplication-TileColor" content="#0A0A0A" />

    <!-- ── FONTS — preconnect first then load ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Special+Elite&display=swap"
      rel="stylesheet"
    />

    <!-- ── PRELOAD CRITICAL ASSETS ── -->
    <link rel="preload" href="/mascot.png" as="image" />
    <link rel="preload" href="/products/villain-front.png" as="image" />
    <link rel="preload" href="/bg-video.mp4" as="video" type="video/mp4" />

    <!-- ── DNS PREFETCH — speeds up API calls ── -->
    <link
      rel="dns-prefetch"
      href="https://52m6m73pkj.execute-api.us-east-2.amazonaws.com"
    />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />

    <!-- ── PREVENT FLASH OF UNSTYLED CONTENT ── -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: #f5f0e8;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
