name: Deploy Villain Society

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── HTML — never cache so updates are instant ──
      - name: Deploy HTML
        run: |
          aws s3 sync dist/ s3://villain-society-website \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # ── JS and CSS — cache 1 year (Vite hashes filenames) ──
      - name: Deploy JS and CSS
        run: |
          aws s3 sync dist/ s3://villain-society-website \
            --exclude "*" \
            --include "*.js" \
            --include "*.css" \
            --cache-control "public, max-age=31536000, immutable"

      # ── Images — cache 1 year ──
      - name: Deploy Images
        run: |
          aws s3 sync dist/ s3://villain-society-website \
            --exclude "*" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --include "*.webp" \
            --cache-control "public, max-age=31536000, immutable"

      # ── Videos — cache 1 year ──
      - name: Deploy Videos
        run: |
          aws s3 sync dist/ s3://villain-society-website \
            --exclude "*" \
            --include "*.mp4" \
            --include "*.webm" \
            --cache-control "public, max-age=31536000, immutable"

      # ── Fonts and other assets ──
      - name: Deploy Fonts and other assets
        run: |
          aws s3 sync dist/ s3://villain-society-website \
            --exclude "*" \
            --include "*.woff" \
            --include "*.woff2" \
            --include "*.ttf" \
            --include "*.eot" \
            --include "*.json" \
            --include "*.txt" \
            --include "*.xml" \
            --cache-control "public, max-age=31536000, immutable"

      # ── Invalidate CloudFront so users get fresh HTML ──
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2LWQM68DL2S6O \
            --paths "/*"
